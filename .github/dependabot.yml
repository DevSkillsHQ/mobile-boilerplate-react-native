# Grouped, weekly updates (QOHA-3756). Majors of packages that only work together arrive
# as one PR per family; every minor and patch update of a directory arrives as one PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Expo pins these per SDK; they only move together through an SDK upgrade
    # (npx expo install expo@^N --fix), which Dependabot cannot do.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: "jest-expo"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
